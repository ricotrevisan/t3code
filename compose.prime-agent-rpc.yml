services:
  t3code-prime:
    build:
      context: .
      dockerfile: deploy/coolify-source/Dockerfile
      args:
        SOURCE_SHA: ${SOURCE_SHA:-unknown}
    user: "1000:1000"
    environment:
      # Port-qualified Coolify magic variables provision HTTPS and route to port 3773.
      SERVICE_FQDN_T3CODE_PRIME_3773:
      SERVICE_URL_T3CODE_PRIME_3773:
      HOME: /home/node
      PRIME_AGENT_CODING_AGENT_DIR: /home/node/.prime/agent
      T3CODE_HOME: /home/node/.t3
    expose:
      - "3773"
    labels:
      # Explicit labels keep routing deterministic when Coolify's Compose parser
      # preserves advanced external-volume/network constructs.
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.t3code-prime-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.t3code-prime-http.rule=Host(`t3code-prime.nocode-to-knowcode.com`)"
      - "traefik.http.routers.t3code-prime-http.entrypoints=http"
      - "traefik.http.routers.t3code-prime-http.middlewares=t3code-prime-redirect"
      - "traefik.http.routers.t3code-prime-http.service=t3code-prime"
      - "traefik.http.routers.t3code-prime-https.rule=Host(`t3code-prime.nocode-to-knowcode.com`)"
      - "traefik.http.routers.t3code-prime-https.entrypoints=https"
      - "traefik.http.routers.t3code-prime-https.tls=true"
      - "traefik.http.routers.t3code-prime-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.t3code-prime-https.service=t3code-prime"
      - "traefik.http.services.t3code-prime.loadbalancer.server.port=3773"
    networks:
      - coolify
    volumes:
      - t3_source_data:/home/node/.t3
      - codex_source_data:/home/node/.codex
      - prime_agent_source_data:/home/node/.prime
      - type: volume
        source: shared_data
        target: /opt/data/projects
        volume:
          subpath: projects
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:3773/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  # Deliberately new, separate volumes; never point these at production state.
  t3_source_data:
  codex_source_data:
  prime_agent_source_data:
  # Existing Docker volume that backs /opt/data; expose only its projects subtree.
  shared_data:
    external: true
    name: 1188e9713c0a59d0d4a949bf49698a49084b2584648d3f4e5fbb3cf8691c688d

networks:
  # Raw Compose resources must join Coolify's proxy network explicitly.
  coolify:
    external: true
    name: coolify
