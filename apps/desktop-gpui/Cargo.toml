[package]
name = "t3code-desktop-gpui"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "t3code-desktop-gpui"

[dependencies]
gpui-kit = "=0.7.1"
# Bounded first-frame thumbnails; already present transitively through GPUI.
image = { version = "=0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
alacritty_terminal = "=0.25.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-framework = "=3.7.0"
async-channel = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
base64 = "=0.22.1"
sha2 = "=0.10.9"
p256 = { version = "=0.13.2", features = ["ecdsa"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-user-notifications = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSDockTile",
  "NSSound",
] }

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "=0.7.1", features = ["test-support"] }

# Debug builds leave GPUI's framework crates unoptimized, which makes the app
# visibly sluggish to review. Optimize the framework while keeping app code
# debuggable; see the GPUI Kit installation guide.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-scheduler = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
