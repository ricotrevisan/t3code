[package]
name = "t3code-desktop-gpui"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "t3code-desktop-gpui"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-framework = "=3.7.0"
async-channel = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
base64 = "=0.22.1"
sha2 = "=0.10.9"
p256 = { version = "=0.13.2", features = ["ecdsa"] }

[dev-dependencies]
tempfile = "3"
gpui = { version = "=0.2.2", default-features = false, features = [
  "runtime_shaders",
  "test-support",
] }
