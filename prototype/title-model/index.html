<!doctype html>
<html><head><meta charset="utf-8"><title>PROTOTYPE - title model in T3 thread list</title>
<style>
 :root { color-scheme: dark; }
 body { margin:0; font: 13px/1.45 -apple-system, system-ui, sans-serif; background:#111114; color:#e7e7ea; display:flex; height:100vh; overflow:hidden; }

<script>
const ROWS = [{"msg": "I work deploying a bunch of OpenClaw agents. OpenClaw has become bloated. I\u2019m debating building my own harness based on Elixir\u2019s primitives. The core should be a lean harness like Pi (but written in Elixir) Be extensible with plugins, skills, subagents, etc. It should communicate through Slack and be accessible via the TUI, too. It should not be a personal agent, it should focus on working with a team of people. Let\u2019s do some wayfinder to find the minimum viable product we can ship to test this out.", "baseline": "I work deploying a bunch of OpenClaw agents. OpenClaw has become bloa...", "provider": "grok", "ref": null, "ref_how": null, "n_refs": 0, "ambiguous": false, "expected_ref": null, "extraction_right": true, "model_title": "Building a lean harness for OpenClaw", "model_desc": "A project proposes a harness built on Elixir primitives to communicate with Slack and the TUI. The goal is to create a minimal viable product that can be tested with a team of people.", "slug_title": "Building a lean harness for OpenClaw", "slug_desc": "A project proposes a harness built on Elixir primitives to communicate through Slack and be accessible via the TUI. The goal is to create a minimal viable product that focuses on team collaboration rather than individual agents.", "variants": {"plain": "Building a lean harness for OpenClaw", "prefix": "Building a lean harness for OpenClaw", "suffix": "Building a lean harness for OpenClaw"}}, {"msg": "Can you check the status of the main branch? I think we got halfway through a ticket and iddn't finish it.", "baseline": "Check Main Branch Progress", "provider": "codex", "ref": null, "ref_how": null, "n_refs": 0, "ambiguous": false, "expected_ref": null, "extraction_right": true, "model_title": "Checking the status of a main branch", "model_desc": "A person is checking the status of a main branch after finishing a ticket.", "slug_title": "Checking the status of a main branch", "slug_desc": "A person c : true, "model_title": "Patching and updated invites", "model_desc": "A person explains that each person received an updated invite after the initial patch.", "slug_title": "Patching and updated invites", "slug_desc": "A person explains that each person received an updated invite after the initial patch.", "variants": {"plain": "Patching and updated invites", "prefix": "Patching and updated invites", "suffix": "Patching and updated invites"}}, {"msg": "Implement \u25c9 #28: add a pre-SSE authorization boundary for page events and streams. It is the next child of epic #24 after #25-#29.", "baseline": null, "provider": null, "ref": "#28", "ref_how": "bare #N at lead/imperative", "n_refs": 4, "ambiguous": true, "expected_ref": "#28", "extraction_right": true, "model_title": "Adding pre-SSE authorization boundaries", "model_desc": "Implementing a pre-SSE authorization boundary for page events and streams is a child of epic #24 after #25-#29.", "slug_title": "Implementation of #28 pre-SSE boundary", "slug_desc": "Implementing #28 adds a pre-SSE authorization boundary for page events and streams. This child of epic #24 is identified as #25-#29.", "variants": {"plain": "Adding pre-SSE authorization boundaries", "prefix": "#28: Adding pre-SSE authorization boundaries", "suffix": "Adding pre-SSE authorization boundaries \u00b7 #28"}}, {"msg": "let's pick up #30. Is it an implementation or grilling or design?", "baseline": null, "provider": null, "ref": "#30", "ref_how": "bare #N at lead/imperative", "n_refs": 1, "ambiguous": false, "expected_ref": "#30", "extraction_right": true, "model_title": "Identifying the type of #30", "model_desc": "The speaker identifies #30 as either an implementation, grilling, or design.", "slug_title": "Identifying the type of #30", "slug_desc": "The speaker identifies #30 as either an implementation, grilling, or design.", "variants": {"plain": "Identifying the type of #30", "prefix": "#30: Identifying the type of #30", "suffix": "Identifying the type of #30 \u00b7 #30"}}, {"msg": "Implement DEF-1916: every participant should get an updated invite.", "baseline": null, "provider": null, "ref": "DEF-1916", "ref_how": "linear-key", "n_refs": 1, "ambiguous": false, "expected_ref": "DEF-1916", "extraction_right": true, "model_title": "Mandatory invitation updates for participants", "model_desc": "Participants must receive an updated invite to ensure they are aware of the latest information.", "slug_title": "Implement DEF-1916: participant updates", "slug_desc": "Participants should receive an updated invite to ensure they are aware of changes.", "variants": {"plain": "Mandatory invitation updates for participants", "prefix": "DEF-1916: Mandatory invitation updates for participants", "suffix": "Mandatory invitation updates for participants \u00b7 DEF-1916"}}, {"msg": "Fix the flaky test called out in ricotrevisan/bubble_ex#22", "baseline": null, "provider": null, "ref": "bubble_ex#22", "ref_how": "owner/repo#N", "n_refs": 1, "ambiguous": false, "expected_ref": "bubble_ex#22", "extraction_right": true, "model_title": "Fixing the flaky test in ricotrevisan/bubble_ex", "model_desc": "A fix is proposed for a flaky test identified in the ricotrevisan/bubble_ex#22 issue.", "slug_title": "Fixing flaky test in ricotrevisan/bubble_ex#22", "slug_desc": "A ticket reference is provided as DEF-1916: Fix flaky test in ricotrevisan/bubble_ex#22.", "variants": {"plain": "Fixing the flaky test in ricotrevisan/bubble_ex", "prefix": "bubble_ex#22: Fixing the flaky test in ricotrevisan/bubble_ex", "suffix": "Fixing the flaky test in ricotrevisan/bubble_ex \u00b7 bubble_ex#22"}}, {"msg": "https://github.com/ricotrevisan/dstar/issues/28 - can you check if it compiles and the site runs?", "baseline": null, "provider": null, "ref": "dstar#28", "ref_how": "github-url", "n_refs": 1, "ambiguous": false, "expected_ref": "dstar#28", "extraction_right": true, "model_title": "Checking DStar compilation and site functionality", "model_desc": "A user requests a check to confirm whether the DStar compiler and site run correctly.", "slug_title": "Issue 28 DSTAR compilation and site", "slug_desc": "A request is made to check if the DSTAR compiler and site run correctly. The issue number is identified as 28.", "variants": {"plain": "Checking DStar compilation and site functionality", "prefix": "dstar#28: Checking DStar compilation and site functionality", "suffix": "Checking DStar compilation and site functionality \u00b7 dstar#28"}}, {"msg": "The export crashes on a UTF-8 file, and the key is AES-256, not SHA-256. Can you look?", "baseline": null, "provider": null, "ref": null, "ref_how": null, "n_refs": 3, "ambiguous": true, "expected_ref": null, "extraction_right": true, "model_title": "AES-256 encryption for UTF-8 files", "model_desc": "The export crashes on a UTF-8 file using AES-256 instead of SHA-256.", "slug_title": "Export crashes on UTF-8 file", "slug_desc": "The export crashes on a UTF-8 file using AES-256 instead of SHA-256.", "variants": {"plain": "AES-256 encryption for UTF-8 files", "prefix": "AES-256 encryption for UTF-8 files", "suffix": "AES-256 encryption for UTF-8 files"}}, {"msg": "the JSON has a &#8220; smart quote in it and the parser chokes on it", "baseline": null, "provider": null, "ref": null, "ref_how": null, "n_refs": 0, "ambiguous": false, "expected_ref": null, "extraction_right": true, "model_title": "JSON parser handling smart quotes", "model_desc": "A parser issues an error when it encounters a smart quote in the JSON data.", "slug_title": "JSON smart quote parsing issue", "slug_desc": "A parser error occurs when a JSON object contains a smart quote. The issue arises because the smart quote is being interpreted as a string rather than a special token.", "variants": {"plain": "JSON parser handling smart quotes", "prefix": "JSON parser handling smart quotes", "suffix": "JSON parser handling smart quotes"}}];
let variant = "plain", showDesc = false, sel = 0;

function titleOf(r) {
  if (variant === "plain") return r.model_title || "(none)";
  return r.variants[variant] || r.model_title || "(none)";
}
function setVariant(v) { variant = v; render(); }
function toggleDesc() { showDesc = !showDesc; document.getElementById("db").textContent = "description: " + (showDesc ? "on" : "off"); render(); }

function render() {
  document.querySelectorAll("#bar button[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === variant));
  document.getElementById("list").innerHTML = ROWS.map((r, i) => {
    const chip = variant === "chip" && r.ref ? `<span class="chip">${r.ref}</span>` : "";
    const desc = showDesc && r.model_desc ? `<div class="sub">${r.model_desc.slice(0, 70)}</div>` : "";
    const branch = r.provider ? `${r.provider} · main` : "no provider";
    return `<div class="row ${i === sel ? "sel" : ""}" onclick="sel=${i};render()">
      <div class="title">${chip}${titleOf(r)}</div>
      <div class="sub">${branch}</div>${desc}</div>`;
  }).join("");
  const r = ROWS[sel];
  const refLine = r.ref
    ? `<span class="good">${r.ref}</span> <span class="sub">via ${r.ref_how}</span>`
    : `<span class="sub">no reference found</span>`;
  const exp = r.expected_ref === undefined || r.expected_ref === null ? "(non-ticket input)" : r.expected_ref;
  document.getElementById("detail").innerHTML = `
   <div class="box"><div class="lbl">input (first user message)</div><div class="mono">${r.msg}</div></div>
   <div class="box"><div class="lbl">today's title (from the agent provider)</div>${r.baseline ? r.baseline : "<span class=\"sub\">- new thread, no title yet -</span>"}</div>
   <div class="box"><div class="lbl">model title (canonical prompt)</div>${r.model_title}
      <div class="desc">${r.model_desc || ""}</div></div>
   <div class="box"><div class="lbl">model title (slug instruction added to prompt)</div>
      ${r.slug_title}<div class="desc">${r.slug_desc || ""}</div></div>
   <div class="box"><div class="lbl">extracted ticket reference</div>${refLine}
      <div class="sub">expected: ${exp}</div></div>
   <div class="box"><div class="lbl">composed for the list</div>
      <div>plain  : ${r.variants.plain || "(none)"}</div>
      <div>prefix : ${r.variants.prefix || "(none)"}</div>
      <div>suffix : ${r.variants.suffix || "(none)"}</div></div>`;
}
render();
</script></body></html>
