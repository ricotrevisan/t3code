name: Coolify image build

on:
  push:
    branches:
      - coolify-deploy
    paths:
      - deploy/coolify/**
      - .github/workflows/coolify-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/coolify
          push: false
          tags: t3code-coolify:test
