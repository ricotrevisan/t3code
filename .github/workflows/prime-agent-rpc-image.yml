name: Prime Agent RPC image

on:
  push:
    branches:
      - deploy/prime-agent-rpc
    paths:
      - ".github/workflows/prime-agent-rpc-image.yml"
      - ".dockerignore"
      - "deploy/coolify-source/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "oxlint-plugin-t3code/**"
      - "patches/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "t3.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build source image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image without pushing
        shell: bash
        run: |
          set -o pipefail
          if ! docker build \
            --progress=plain \
            --build-arg "SOURCE_SHA=${GITHUB_SHA}" \
            --file deploy/coolify-source/Dockerfile \
            --tag t3code-prime-agent-rpc:ci \
            . 2>&1 | tee /tmp/docker-build.log; then
            tail_output="$(tail -n 25 /tmp/docker-build.log)"
            tail_output="${tail_output//'%'/'%25'}"
            tail_output="${tail_output//$'\r'/'%0D'}"
            tail_output="${tail_output//$'\n'/'%0A'}"
            echo "::error title=Source image build failed::${tail_output}"
            exit 1
          fi
