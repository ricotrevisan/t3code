name: Prime Agent RPC image

on:
  push:
    branches:
      - deploy/prime-agent-rpc
    paths:
      - ".github/workflows/prime-agent-rpc-image.yml"
      - ".dockerignore"
      - "deploy/coolify-source/**"
      - "compose.prime-agent-rpc.yml"
      - "apps/server/**"
      - "apps/web/**"
      - "assets/**"
      - "packages/**"
      - "oxlint-plugin-t3code/**"
      - "patches/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "t3.json"
      - "tsconfig.base.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build source image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Coolify Compose routing
        shell: bash
        run: |
          docker compose -f compose.prime-agent-rpc.yml config --quiet
          docker compose -f compose.prime-agent-rpc.yml config | grep -q 'SERVICE_FQDN_T3CODE_3773'
          docker compose -f compose.prime-agent-rpc.yml config | grep -q 'SERVICE_URL_T3CODE_3773'
          docker compose -f compose.prime-agent-rpc.yml config | grep -q 'name: coolify'

      - name: Build image without pushing
        shell: bash
        run: |
          set -o pipefail
          if ! docker build \
            --progress=plain \
            --build-arg "SOURCE_SHA=${GITHUB_SHA}" \
            --file deploy/coolify-source/Dockerfile \
            --tag t3code-prime-agent-rpc:ci \
            . 2>&1 | tee /tmp/docker-build.log; then
            tail_output="$(tail -n 25 /tmp/docker-build.log)"
            tail_output="${tail_output//'%'/'%25'}"
            tail_output="${tail_output//$'\r'/'%0D'}"
            tail_output="${tail_output//$'\n'/'%0A'}"
            echo "::error title=Source image build failed::${tail_output}"
            exit 1
          fi

      - name: Smoke-test agent runtime
        shell: bash
        run: |
          docker run --rm --entrypoint sh t3code-prime-agent-rpc:ci -euc '
            test "$(id -u)" = 1000
            test "$(id -g)" = 1000
            test "$HOME" = /home/node
            test "$PRIME_AGENT_CODING_AGENT_DIR" = /home/node/.prime/agent
            test "$PRIME_AGENT_KERNEL_VENV" = /home/node/.prime/agent/kernel-venv
            test "$UV_CACHE_DIR" = /home/node/.prime/uv/cache
            test "$UV_PYTHON_INSTALL_DIR" = /home/node/.prime/uv/python
            test "$(command -v prime-agent)" = /usr/local/bin/prime-agent
            test "$(prime-agent --version 2>&1)" = 0.8.0
            test "$(command -v uv)" = /usr/local/bin/uv
            test "$(uv --version | cut -d " " -f 1-2)" = "uv 0.12.5"
            test -L /usr/local/bin/prime-agent
            test "$(readlink /usr/local/bin/prime-agent)" = /opt/prime-agent/node_modules/.bin/prime-agent
            command -v codex >/dev/null
            codex --version
            touch /home/node/.prime/.ci-write-test
            rm /home/node/.prime/.ci-write-test
          '

      - name: Smoke-test fresh Prime kernel bootstrap
        shell: bash
        run: |
          docker run --rm --entrypoint sh t3code-prime-agent-rpc:ci -euc '
            test ! -e "$PRIME_AGENT_KERNEL_VENV"
            timeout 600 node --input-type=module -e '\''
              import { execFileSync } from "node:child_process";
              import { ensureKernelPython } from "file:///opt/prime-agent/node_modules/prime-agent/dist/core/kernel/bootstrap.js";
              const python = await ensureKernelPython({ onProgress: console.error });
              if (!python.startsWith(process.env.PRIME_AGENT_KERNEL_VENV + "/")) {
                throw new Error(`kernel Python escaped persisted venv: ${python}`);
              }
              execFileSync(python, ["-c", "import ipykernel, rlm, requests"], { stdio: "inherit" });
            '\''
            test -x "$PRIME_AGENT_KERNEL_VENV/bin/python"
            test -d "$UV_PYTHON_INSTALL_DIR"
            test ! -e /home/node/.local/share/prime
          '
