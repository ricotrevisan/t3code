name: Prime Agent RPC image

on:
  push:
    branches:
      - deploy/prime-agent-rpc
    paths:
      - ".github/workflows/prime-agent-rpc-image.yml"
      - ".dockerignore"
      - "deploy/coolify-source/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "oxlint-plugin-t3code/**"
      - "patches/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "t3.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build source image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/coolify-source/Dockerfile
          push: false
          build-args: |
            SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
